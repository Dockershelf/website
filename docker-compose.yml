services:
  app:
    image: ${DOCKER_IMAGE:-dockershelf-website:latest}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/home/app/app
      - ~/.npm:/home/app/.npm
    env_file:
      - .env
    environment:
      PORT: 3101
      NODE_OPTIONS: "--max-old-space-size=4096"
    ports:
      - "3101:3101"
